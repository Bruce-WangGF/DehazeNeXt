name: DehazeNeXt_B_ITS
model_type: DehazingModel
scale: 1
num_gpu: 1
manual_seed: 10
datasets:
  train:
    name: ITS
    type: PairedImageDataset
    dataroot_gt: datasets/ITS/train/clear
    dataroot_lq: datasets/ITS/train/hazy
    filename_tmpl: '{}'
    io_backend:
      type: disk
    gt_size: 256
    use_hflip: true
    use_rot: true
    use_shuffle: true
    num_worker_per_gpu: 2
    batch_size_per_gpu: 1
    dataset_enlarge_ratio: 10
    prefetch_mode: null
  val:
    name: ITS_val
    type: PairedImageDataset
    dataroot_gt: datasets/ITS/test/clear
    dataroot_lq: datasets/ITS/test/hazy
    io_backend:
      type: disk
network_g:
  type: DehazeNeXt
  dim: 36
  nResblock: 15
path:
  pretrain_network_g: null
  strict_load_g: true
  resume_state: null
train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: 0.0001
    weight_decay: 0
    betas:
    - 0.9
    - 0.99
  scheduler:
    type: CosineAnnealingRestartLR
    periods:
    - 600000
    restart_weights:
    - 1
    eta_min: 1.0e-06
  total_iter: 600000
  warmup_iter: -1
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
  fftHighfreq_opt:
    type: EnhancedFFTLoss
    loss_weight: 0.1
    reduction: mean
    high_freq_weight: 1.25
    freq_bands: 4
val:
  val_freq: 5000.0
  save_img: false
  pbar: false
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
      better: higher
logger:
  print_freq: 1000
  save_checkpoint_freq: 5000.0
  use_tb_logger: true
  wandb:
    project: null
    resume_id: null
dist_params:
  backend: nccl
  port: 29500
